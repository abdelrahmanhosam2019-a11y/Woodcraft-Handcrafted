<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2883a"/>
      <stop offset="50%" style="stop-color:#d4a04a"/>
      <stop offset="100%" style="stop-color:#c2883a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#0f0e0c" rx="12"/>
  
  <!-- Tree/Wood Icon -->
  <g transform="translate(10, 6)">
    <!-- Tree trunk -->
    <rect x="20" y="40" width="6" height="22" rx="1.5" fill="url(#gold)"/>
    <!-- Wood rings -->
    <circle cx="23" cy="28" r="22" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="23" cy="28" r="17" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="23" cy="28" r="12" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="23" cy="28" r="7" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="23" cy="28" r="3" fill="url(#gold)" opacity="0.9"/>
    <!-- Leaf -->
    <path d="M23 6 Q31 12 28 22 Q25.5 16 23 6Z" fill="url(#gold)" opacity="0.6"/>
  </g>
</svg>