<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2883a"/>
      <stop offset="50%" style="stop-color:#d4a04a"/>
      <stop offset="100%" style="stop-color:#c2883a"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a06e2a"/>
      <stop offset="100%" style="stop-color:#c2883a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="120" fill="#0f0e0c" rx="12"/>
  
  <!-- Tree/Wood Icon -->
  <g transform="translate(24, 20)">
    <!-- Tree trunk -->
    <rect x="28" y="50" width="8" height="30" rx="2" fill="url(#gold)"/>
    <!-- Tree canopy - stylized wood rings -->
    <circle cx="32" cy="35" r="28" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="32" cy="35" r="22" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="32" cy="35" r="16" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="32" cy="35" r="10" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="32" cy="35" r="5" fill="url(#gold)" opacity="0.9"/>
    <!-- Small leaf accent -->
    <path d="M32 7 Q42 15 38 28 Q35 20 32 7Z" fill="url(#gold)" opacity="0.6"/>
  </g>
  
  <!-- Brand Name -->
  <text x="95" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" letter-spacing="2" fill="#f6f2ea">
    Woodcraft
  </text>
  
  <!-- Tagline -->
  <text x="95" y="78" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#c2883a" text-transform="uppercase" opacity="0.8">
    HANDCRAFTED EXCELLENCE
  </text>
  
  <!-- Subtle line -->
  <line x1="95" y1="85" x2="280" y2="85" stroke="#c2883a" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Est date -->
  <text x="95" y="98" font-family="Inter, Arial, sans-serif" font-size="8" letter-spacing="3" fill="#f6f2ea" opacity="0.3">
    SINCE 1987 · VERMONT
  </text>
</svg>